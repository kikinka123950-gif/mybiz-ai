<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYBIZ AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4f1;
    color: #292522;
}

header {
    background: #211f1d;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #cfc9c4;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.welcome {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.welcome h2 {
    margin-top: 0;
}

.profile {
    background: #f0e9ff;
    border-radius: 15px;
    padding: 15px;
    margin-top: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 18px;
    background: white;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
    font-size: 15px;
}

button:hover {
    background: #f0e9ff;
}

button strong {
    display: block;
    margin-bottom: 5px;
}

.result {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-top: 20px;
    display: none;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.result h2 {
    margin-top: 0;
}

.output {
    background: #f8f6f3;
    padding: 18px;
    border-radius: 12px;
    white-space: pre-line;
    line-height: 1.6;
}

.copy {
    margin-top: 12px;
    background: #7950e8;
    color: white;
    text-align: center;
}

@media(max-width:600px) {
    .buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>MYBIZ AI</h1>
    <p>Tvoja AI pravá ruka pre podnikanie</p>
</header>

<div class="container">

    <div class="welcome">

        <h2>Ahoj, Kristiibeauty 👋</h2>

        <p>
        Pomôžem ti s marketingom, sociálnymi sieťami
        a komunikáciou so zákazníčkami.
        </p>

        <div class="profile">

            <strong>Business Profile</strong><br><br>

            💄 Kozmetický salón<br>
            📍 Nitra<br>
            ✨ Líčenie + starostlivosť o pleť<br>
            💰 15–40 €<br>
            👰 Nevesty + ženy 20–70 rokov

        </div>

    </div>


    <div class="buttons">

        <button onclick="showResult('instagram')">

            📱

            <strong>Vytvor mi Instagram</strong>

            Rozbehni profil od úplného začiatku.

        </button>


        <button onclick="showResult('post')">

            ✨

            <strong>Vytvor príspevok</strong>

            Napíš mi marketingový príspevok.

        </button>


        <button onclick="showResult('reel')">

            🎬

            <strong>Vymysli Reel</strong>

            Nápad na krátke video.

        </button>


        <button onclick="showResult('advert')">

            📢

            <strong>Vytvor reklamu</strong>

            Pomôž mi získať zákazníčky.

        </button>


        <button onclick="showResult('customer')">

            💬

            <strong>Odpovedz zákazníčke</strong>

            Priprav profesionálnu odpoveď.

        </button>


        <button onclick="showResult('plan')">

            📅

            <strong>Vytvor plán</strong>

            Obsah na najbližších 7 dní.

        </button>

    </div>


    <div class="result" id="result">

        <h2 id="resultTitle"></h2>

        <div class="output" id="output"></div>

        <button class="copy" onclick="copyText()">

            📋 Skopírovať výsledok

        </button>

    </div>

</div>


<script>

function showResult(type) {

    const result = document.getElementById("result");

    const title = document.getElementById("resultTitle");

    const output = document.getElementById("output");

    result.style.display = "block";


    if (type === "instagram") {

        title.innerText = "📱 Instagram štart";

        output.innerText =
`NÁZOV PROFILU

@kristiibeauty


BIO

💄 Líčenie & starostlivosť o pleť
👰 Svadobné líčenie v Nitre
✨ Zvýrazníme tvoju prirodzenú krásu
📩 Objednávky → DM / telefón


PRVÝCH 5 PRÍSPEVKOV

1. Predstavenie Kristiibeauty
2. Služby a ceny
3. Svadobné líčenie
4. Tipy na starostlivosť o pleť
5. Ukážka práce


PRVÁ STORY

„Ahoj, vitaj na profile Kristiibeauty 🤍
Čo by si si dnes vybrala – krásne líčenie alebo chvíľku pre svoju pleť?“`;

    }


    if (type === "post") {

        title.innerText = "✨ Instagram príspevok";

        output.innerText =
`Nie vždy potrebuješ viac make-upu.

Niekedy stačí správne zvýrazniť
to, čo už máš. ✨

V Kristiibeauty sa venujeme líčeniu
a starostlivosti o pleť v Nitre.

💄 Líčenie
🧴 Starostlivosť o pleť
👰 Svadobné líčenie

📩 Objednávky správou.

Dopraj si chvíľku pre seba. 🤍`;

    }


    if (type === "reel") {

        title.innerText = "🎬 Nápad na Reel";

        output.innerText =
`REEL: Premena za pár sekúnd

ZÁBER 1
Prirodzená tvár

ZÁBER 2
Príprava pleti

ZÁBER 3
Líčenie očí

ZÁBER 4
Hotový make-up

ZÁBER 5
Výsledok

TEXT:

„Nie viac make-upu.
Lepšie zvýraznenie toho,
čo už máš.“

CTA:

„Objednávky v Nitre → DM 🤍“`;

    }


    if (type === "advert") {

        title.innerText = "📢 Reklama";

        output.innerText =
`HĽADÁŠ KOZMETICKÝ SALÓN V NITRE? 🤍

Chceš sa cítiť krásne
a zároveň zostať sama sebou?

Kristiibeauty ponúka:

💄 Líčenie
🧴 Starostlivosť o pleť
👰 Svadobné líčenie

📍 Nitra

Napíš nám správu
a rezervuj si svoj termín.

✨ Kristiibeauty`;

    }


    if (type === "customer") {

        title.innerText = "💬 Odpoveď zákazníčke";

        output.innerText =
`Ahoj 🤍

Ďakujeme za správu!

Cena služby sa pohybuje približne
od 15 € do 40 € podľa typu
a náročnosti.

Napíš nám, prosím, o akú službu
máš záujem a približný dátum.

Radi ti potvrdíme dostupnosť
a presnú cenu. 😊`;

    }


    if (type === "plan") {

        title.innerText = "📅 Plán na 7 dní";

        output.innerText =
`PONDELOK
Predstavenie Kristiibeauty

UTOROK
Tip na starostlivosť o pleť

STREDA
Reel – premena

ŠTVRTOK
Stories – anketa

PIATOK
Ukážka práce

SOBOTA
Svadobné líčenie

NEDEĽA
Osobnejší príspevok
+ výzva na rezerváciu`;

    }

}


function copyText() {

    const text =
        document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("Výsledok bol skopírovaný. ✅");

}

</script>

</body>
</html>
